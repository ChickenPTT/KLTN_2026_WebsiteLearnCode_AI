<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#090b10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mnemonic — Luyện code theo năng lực</title>
    <meta name="application-name" content="Mnemonic" />
    <meta name="description" content="Mnemonic là nền tảng luyện lập trình theo năng lực: luyện đề có chấm tự động, ôn bằng flashcard, Đấu hạng và góp ý mã nguồn bằng AI." />
    <meta property="og:site_name" content="Mnemonic" />
    <meta property="og:title" content="Mnemonic — Luyện code theo năng lực" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app_theme') || 'dark';
          var isDark = saved === 'dark';
          if (saved === 'system') {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          if (!isDark) {
            root.setAttribute('data-theme', 'light');
            root.classList.add('light-mode');
          } else {
            root.setAttribute('data-theme', 'dark');
            root.classList.remove('light-mode');
          }
        } catch (e) {}
      })();
    </script>
    <!-- Google Identity Services: nut "Dang nhap bang Google" -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Noi dung tinh cho trinh thu thap (Google xac minh OAuth) va trinh duyet tat JavaScript -->
    <noscript>
      <h1>Mnemonic</h1>
      <p>Mnemonic là nền tảng luyện lập trình theo năng lực: luyện đề có chấm tự động, ôn bằng flashcard, Đấu hạng và góp ý mã nguồn bằng AI. Bạn có thể đăng nhập bằng email hoặc tài khoản Google.</p>
      <p><a href="/privacy.html">Chính sách quyền riêng tư</a> · <a href="/terms.html">Điều khoản dịch vụ</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
