spring.application.name=TestModule

# nap file .env (khong bat buoc: khi deploy co the dung bien moi truong that)
spring.config.import=optional:file:./.env[.properties]


#judge0
judge0.api.url=https://judge0-ce.p.rapidapi.com
judge0.api.key=${JUDGE0_API_KEY}
judge0.api.host=judge0-ce.p.rapidapi.com


#gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent

groq.api.key=${GROD_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=openai/gpt-oss-120b
#database
spring.datasource.url=jdbc:postgresql://localhost:5432/testai_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#jwt — access token 15 phut. Secret >= 32 ky tu. Dat JWT_SECRET trong .env khi demo that.
jwt.secret=${JWT_SECRET:dev-only-kltn-jwt-secret-key-32b}
jwt.access-token-expiration-ms=900000
# refresh token 7 ngay, luu trong httpOnly cookie. Deploy HTTPS thi dat JWT_COOKIE_SECURE=true
jwt.refresh-token-expiration-ms=604800000
jwt.refresh-cookie-secure=${JWT_COOKIE_SECURE:false}